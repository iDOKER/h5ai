name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（如 0.30.1）'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Extract version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.tag }}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version: ${VERSION}"

    - name: Update package.json version
      run: |
        node -e "
        const fs = require('fs');
        const pkg = require('./package.json');
        pkg.version = '${{ steps.version.outputs.version }}';
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        "

    - name: Build release package
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: h5ai-${{ steps.version.outputs.version }}
        path: build/*.zip
        retention-days: 365

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="v${VERSION}"
        ZIP_FILE=$(ls build/*.zip | head -1)

        # 如果 tag 不存在则创建（workflow_dispatch 场景）
        if ! git rev-parse "$TAG" >/dev/null 2>&1; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"
        fi

        gh release create "$TAG" "$ZIP_FILE" \
          --title "h5ai v${VERSION}" \
          --notes "## h5ai v${VERSION}

        ### 安装说明
        1. 下载 zip 文件
        2. 解压到 Web 服务器目录
        3. 确保 PHP 7.0+ 已安装
        4. 访问 \`/_h5ai/\` 查看信息页面

        ### 变更日志
        详见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)" \
          --latest
